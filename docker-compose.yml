version: '3.8'

services:
  duckflow:
    build: .
    container_name: duckflow
    ports:
      - "8080:8080" # REST API
      - "8081:8081" # Web IDE
    volumes:
      # Mount data files to persist database state across container restarts
      - duckflow_data:/app/data
    restart: unless-stopped

volumes:
  duckflow_data:
